<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /> <!-- UTF-8 encoding for all characters -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- responsive viewport -->
  <title>Erisk Chat Bot</title>
  <style>
    /* ── Reset & base ──────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; } /* universal box model reset */
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; } /* dark base theme */

    /* ── Login screen ──────────────────────────────────── */
    #login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; } /* full-page centered layout */
    .login-box { background: #16213e; border: 1px solid #0f3460; border-radius: 14px; padding: 2.5rem 2rem; width: 340px; text-align: center; } /* card container */
    .login-box h1 { font-size: 1.9rem; color: #e94560; margin-bottom: 0.35rem; letter-spacing: -0.5px; } /* app title */
    .login-box p { color: #666; font-size: 0.85rem; margin-bottom: 1.75rem; } /* subtitle */
    .login-box input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #0f3460; border-radius: 8px; background: #0d1b2a; color: #e0e0e0; font-size: 0.95rem; outline: none; transition: border-color 0.2s; } /* name input field */
    .login-box input:focus { border-color: #e94560; } /* highlight on focus */
    .login-box button { width: 100%; margin-top: 0.85rem; padding: 0.75rem; background: #e94560; border: none; border-radius: 8px; color: #fff; font-size: 0.95rem; cursor: pointer; transition: opacity 0.2s; } /* connect button */
    .login-box button:hover { opacity: 0.85; } /* hover dimming */

    /* ── Chat screen ───────────────────────────────────── */
    #chat-screen { display: none; height: 100vh; flex-direction: row; } /* hidden by default, shows as flex row */
    #chat-screen.active { display: flex; } /* visible state */

    /* ── Sidebar ────────────────────────────────────────── */
    #sidebar { width: 255px; min-width: 255px; background: #16213e; border-right: 1px solid #0f3460; display: flex; flex-direction: column; padding: 1.25rem 1rem; gap: 1rem; } /* left panel */
    #sidebar-title { color: #e94560; font-size: 1.05rem; font-weight: 700; } /* app name in sidebar */
    #status-bar { background: #0d1b2a; border: 1px solid #0f3460; border-radius: 8px; padding: 0.65rem 0.85rem; font-size: 0.82rem; display: flex; align-items: center; gap: 0.5rem; } /* connection status card */
    #status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; transition: background 0.3s; } /* colored indicator dot */
    #status-dot.connected { background: #4caf50; } /* green = connected */
    #status-dot.connecting { background: #ff9800; } /* orange = reconnecting */
    #status-dot.disconnected { background: #e94560; } /* red = disconnected */
    #status-text { color: #aaa; } /* status label */

    /* ── Command reference panel ─────────────────────────── */
    #commands-panel { flex: 1; overflow-y: auto; } /* scrollable command list */
    #commands-title { color: #555; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.6rem; } /* section label */
    .cmd-card { background: #0d1b2a; border: 1px solid #0f3460; border-radius: 7px; padding: 0.6rem 0.75rem; margin-bottom: 0.5rem; cursor: pointer; transition: border-color 0.2s, background 0.2s; } /* clickable command card */
    .cmd-card:hover { background: #152032; border-color: #e94560; } /* hover highlight */
    .cmd-card code { display: block; color: #e94560; font-size: 0.82rem; margin-bottom: 3px; } /* command syntax */
    .cmd-card span { color: #777; font-size: 0.78rem; line-height: 1.35; } /* command description */

    /* ── Main chat column ────────────────────────────────── */
    #main-chat { flex: 1; display: flex; flex-direction: column; min-width: 0; } /* grows to fill remaining width */

    /* ── Chat header ────────────────────────────────────── */
    #chat-header { background: #16213e; border-bottom: 1px solid #0f3460; padding: 0.8rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; } /* top bar */
    #chat-header h2 { font-size: 0.95rem; font-weight: 600; } /* room name */
    #username-display { color: #e94560; font-size: 0.82rem; margin-left: auto; } /* current user badge */

    /* ── Message list ───────────────────────────────────── */
    #messages { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 0.55rem; } /* scrollable message area */
    .msg { max-width: 72%; padding: 0.55rem 0.85rem; border-radius: 12px; font-size: 0.88rem; line-height: 1.45; word-break: break-word; } /* base bubble style */
    .msg-header { font-size: 0.7rem; margin-bottom: 3px; font-weight: 600; } /* sender name above bubble */
    .msg.incoming { align-self: flex-start; background: #16213e; border: 1px solid #0f3460; } /* messages from others */
    .msg.incoming .msg-header { color: #e94560; } /* sender name in red */
    .msg.outgoing { align-self: flex-end; background: #0f3460; } /* messages I sent */
    .msg.outgoing .msg-header { color: #4caf50; text-align: right; } /* my name in green */
    .msg.system { align-self: center; background: transparent; color: #555; font-size: 0.77rem; font-style: italic; padding: 0.2rem 0; max-width: 90%; text-align: center; } /* system notifications */
    .msg.server-info { align-self: flex-start; background: #0d1f0d; border: 1px solid #1a3d1a; max-width: 85%; } /* server command response */
    .msg.server-info .msg-header { color: #4caf50; } /* green label for server responses */
    .msg.server-info pre { font-family: 'Consolas', 'Courier New', monospace; white-space: pre-wrap; font-size: 0.82rem; color: #88cc88; } /* monospace server output */

    /* ── Input bar ──────────────────────────────────────── */
    #input-area { padding: 0.85rem 1.25rem; border-top: 1px solid #0f3460; background: #16213e; display: flex; gap: 0.5rem; } /* bottom input row */
    #message-input { flex: 1; padding: 0.65rem 1rem; border: 1px solid #0f3460; border-radius: 8px; background: #0d1b2a; color: #e0e0e0; font-size: 0.9rem; outline: none; transition: border-color 0.2s; } /* text field */
    #message-input:focus { border-color: #e94560; } /* focus highlight */
    #message-input:disabled { opacity: 0.4; cursor: not-allowed; } /* greyed out when disconnected */
    #send-btn { padding: 0.65rem 1.15rem; background: #e94560; border: none; border-radius: 8px; color: #fff; font-size: 0.9rem; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; } /* send button */
    #send-btn:hover:not(:disabled) { opacity: 0.85; } /* hover effect when enabled */
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; } /* greyed out when disconnected */

    /* ── Scrollbar ──────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; } /* thin scrollbar */
    ::-webkit-scrollbar-track { background: transparent; } /* invisible track */
    ::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 4px; } /* dark handle */
  </style>
</head>
<body>

<!-- ══ LOGIN SCREEN ══════════════════════════════════════════════ -->
<div id="login-screen"> <!-- shown on page load, hidden after connect -->
  <div class="login-box">
    <h1>Erisk Chat</h1> <!-- app title -->
    <p>WebSocket Chat Bot</p> <!-- subtitle -->
    <input
      type="text"
      id="username-input"
      placeholder="Enter your name…"
      maxlength="32"
      autocomplete="off"
    /> <!-- name field passed as ?name= query parameter to the server -->
    <button id="connect-btn">Connect</button> <!-- triggers WebSocket connection -->
  </div>
</div>

<!-- ══ CHAT SCREEN ═══════════════════════════════════════════════ -->
<div id="chat-screen"> <!-- main chat UI, hidden until connected -->

  <!-- ── Sidebar ──────────────────────────────────────── -->
  <div id="sidebar">
    <div id="sidebar-title">Erisk Chat</div> <!-- branding -->

    <!-- connection status indicator -->
    <div id="status-bar">
      <div id="status-dot" class="disconnected"></div> <!-- colored dot: green/orange/red -->
      <span id="status-text">Disconnected</span> <!-- human-readable state -->
    </div>

    <!-- bot command reference (read from InfoCommand.java + MathCommand.java) -->
    <div id="commands-panel">
      <div id="commands-title">Bot Commands</div>

      <!-- @server info → InfoCommand.execute(clientName, sessionId) -->
      <div class="cmd-card" data-cmd="@server info">
        <code>@server info</code>
        <span>Returns your display name and session ID</span>
      </div>

      <!-- @server math → MathCommand.execute(expression), left-to-right, no precedence -->
      <div class="cmd-card" data-cmd="@server math ">
        <code>@server math &lt;expr&gt;</code>
        <span>Evaluates math left-to-right (no precedence).<br/>
          e.g. 2+3, 10/2, 5*3-1</span>
      </div>
    </div>
  </div>

  <!-- ── Main chat area ─────────────────────────────── -->
  <div id="main-chat">

    <div id="chat-header">
      <h2>Chat Room</h2> <!-- room label -->
      <span id="username-display"></span> <!-- shows "@yourname" after login -->
    </div>

    <div id="messages"></div> <!-- message bubbles appended here dynamically -->

    <div id="input-area">
      <input
        type="text"
        id="message-input"
        placeholder="Type a message or @server command…"
        autocomplete="off"
        disabled
      /> <!-- disabled until WebSocket is OPEN -->
      <button id="send-btn" disabled>Send</button> <!-- disabled until connected -->
    </div>
  </div>
</div>

<script>
  // ── DOM references ──────────────────────────────────────────────────────
  const loginScreen   = document.getElementById('login-screen');   // login page wrapper
  const chatScreen    = document.getElementById('chat-screen');    // chat page wrapper
  const usernameInput = document.getElementById('username-input'); // name text field on login
  const connectBtn    = document.getElementById('connect-btn');    // connect button on login
  const statusDot     = document.getElementById('status-dot');     // colored connection indicator
  const statusText    = document.getElementById('status-text');    // status label text
  const messagesEl    = document.getElementById('messages');       // message list container
  const messageInput  = document.getElementById('message-input'); // message compose field
  const sendBtn       = document.getElementById('send-btn');       // send button
  const userDisplay   = document.getElementById('username-display'); // "@name" label in header
  const cmdCards      = document.querySelectorAll('.cmd-card');    // sidebar command shortcut cards

  // ── Application state ───────────────────────────────────────────────────
  let ws          = null;  // active WebSocket instance
  let username    = '';    // current user's display name (sent as ?name= to server)
  let retryDelay  = 1000; // current reconnect wait in ms (grows with backoff)
  let retryTimer  = null; // handle for the pending setTimeout reconnect
  let intentional = false; // true when the user explicitly disconnects (future use)

  // ── Helpers ─────────────────────────────────────────────────────────────

  // Builds the WebSocket URL using the same host as the page, choosing wss:// on HTTPS
  function buildWsUrl(name) {
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:'; // match page security scheme
    return `${proto}//${window.location.host}/ws?name=${encodeURIComponent(name)}`; // server reads ?name= in afterConnectionEstablished
  }

  // Updates the status dot CSS class and label text
  function setStatus(cssClass, label) {
    statusDot.className = cssClass;    // swap color class: connected | connecting | disconnected
    statusText.textContent = label;   // visible text beside the dot
  }

  // Appends a message bubble to the chat area and scrolls to the bottom
  function addMessage(cssType, sender, text) {
    const bubble = document.createElement('div'); // outer bubble element
    bubble.className = `msg ${cssType}`;          // css type: incoming | outgoing | system | server-info

    if (cssType !== 'system') { // system messages have no sender header
      const hdr = document.createElement('div'); // sender label row
      hdr.className = 'msg-header';
      hdr.textContent = sender;                  // display name or "server"
      bubble.appendChild(hdr);
    }

    if (cssType === 'server-info') {
      const pre = document.createElement('pre'); // monospace block for server responses
      pre.textContent = text;
      bubble.appendChild(pre);
    } else {
      const p = document.createElement('p');     // plain paragraph for chat text
      p.textContent = text;
      bubble.appendChild(p);
    }

    messagesEl.appendChild(bubble);
    messagesEl.scrollTop = messagesEl.scrollHeight; // auto-scroll to newest message
  }

  // Constructs the JSON payload the server expects (Message.java schema)
  function buildPayload(text) {
    return JSON.stringify({           // serialize full Message object
      header: {
        origin:      username,        // MessageHeader.origin — our display name
        destination: null,            // null = broadcast (no specific recipient)
        timestamp:   new Date().toISOString(), // MessageHeader.timestamp as ISO-8601 string
        type:        'Chat'           // MessageType.Chat enum value
      },
      data: {
        message: text                 // MessageData.message — the actual text
      }
    });
  }

  // Parses and renders an incoming WebSocket frame
  function handleFrame(raw) {
    let parsed;
    try {
      parsed = JSON.parse(raw);       // try to parse as Message JSON
    } catch (_) {
      addMessage('system', '', raw);  // non-JSON frames shown as system text (shouldn't happen, SynAckMiddleware is disabled)
      return;
    }

    const msgType = parsed?.header?.type;          // MessageType: "Chat" or "ServerInfo"
    const origin  = parsed?.header?.origin ?? 'server'; // sender name from header
    const text    = parsed?.data?.message ?? '';        // message content from data

    if (msgType === 'Chat') {
      addMessage('incoming', origin, text); // broadcast chat message from another user
      return;
    }

    if (msgType === 'ServerInfo') {
      // The server wraps periodic SessionInfo JSON inside data.message (see Websocket.java printMessage())
      try {
        const inner = JSON.parse(text);            // attempt to unwrap inner JSON string
        if (typeof inner.connectedClients === 'number') {
          addMessage('system', '', `Connected clients: ${inner.connectedClients}`); // periodic session count
          return;
        }
      } catch (_) {
        // data.message is plain text — it's a @server command response
      }
      addMessage('server-info', 'server', text);  // @server info / @server math response
    }
  }

  // ── WebSocket lifecycle ──────────────────────────────────────────────────

  // Opens a new WebSocket connection and registers event handlers
  function connect() {
    clearTimeout(retryTimer);                          // cancel any pending reconnect timer
    setStatus('connecting', 'Connecting…');

    ws = new WebSocket(buildWsUrl(username));          // open connection; server reads ?name= query param

    ws.onopen = () => {
      retryDelay = 1000;                               // reset exponential backoff counter on success
      setStatus('connected', `Connected as ${username}`);
      messageInput.disabled = false;                  // allow typing
      sendBtn.disabled      = false;                  // allow sending
      messageInput.focus();
      addMessage('system', '', 'Connected to server.');
    };

    ws.onmessage = (event) => {
      handleFrame(event.data);                         // dispatch each incoming text frame
    };

    ws.onclose = () => {
      messageInput.disabled = true;                   // block input while offline
      sendBtn.disabled      = true;
      if (intentional) {                              // clean disconnect (reserved for future disconnect button)
        setStatus('disconnected', 'Disconnected');
        return;
      }
      // Unexpected close — retry with exponential backoff (max 30 s)
      const delay = retryDelay;
      retryDelay  = Math.min(retryDelay * 2, 30000); // double delay, cap at 30 s
      setStatus('connecting', `Reconnecting in ${delay / 1000}s…`);
      addMessage('system', '', `Connection lost. Retrying in ${delay / 1000}s…`);
      retryTimer = setTimeout(connect, delay);         // schedule next attempt
    };

    ws.onerror = () => {
      // onerror always fires before onclose; state is handled in onclose
    };
  }

  // ── Send message ─────────────────────────────────────────────────────────

  function sendMessage() {
    const text = messageInput.value.trim();           // read and trim compose field
    if (!text) return;                                // ignore empty sends
    if (!ws || ws.readyState !== WebSocket.OPEN) return; // guard: must be connected

    ws.send(buildPayload(text));                      // send JSON Message to server
    addMessage('outgoing', 'You', text);             // echo locally (server does NOT echo back to sender)
    messageInput.value = '';                          // clear compose field
  }

  // ── Event listeners ──────────────────────────────────────────────────────

  // Clicking a command card pastes its template into the compose field
  cmdCards.forEach(card => {
    card.addEventListener('click', () => {
      messageInput.value = card.dataset.cmd;         // paste command template (may have trailing space for arguments)
      messageInput.focus();
    });
  });

  messageInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();             // Enter key submits the message
  });

  sendBtn.addEventListener('click', sendMessage);    // click also submits

  // Login form: read username and open WebSocket
  function startChat() {
    const name = usernameInput.value.trim();         // sanitize the name
    if (!name) { usernameInput.focus(); return; }    // require a non-empty name

    username = name;                                 // store globally for message payloads
    loginScreen.style.display = 'none';             // hide login screen
    chatScreen.classList.add('active');             // reveal chat screen
    userDisplay.textContent = `@${username}`;        // show "@name" in the header
    connect();                                       // open WebSocket connection
  }

  connectBtn.addEventListener('click', startChat);  // button triggers login
  usernameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') startChat();              // Enter on name field also connects
  });
</script>
</body>
</html>
