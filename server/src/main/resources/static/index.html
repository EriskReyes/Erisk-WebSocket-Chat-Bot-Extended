<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"> <!-- codificación UTF-8 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- viewport responsive -->
  <title>// RIKROIG CHAT</title> <!-- título en el lenguaje visual brutalist -->
  <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- preconexión a Google Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- preconexión al CDN de fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"> <!-- las dos fuentes del estilo: mono + display -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; } /* reset universal */

    :root {
      --ink: #0a0a0a;            /* negro tinta — fondo principal */
      --paper: #f5f0e8;          /* crema papel — el "blanco" del estilo */
      --paper-40: rgba(245, 240, 232, 0.4);  /* crema al 40% — meta y labels */
      --paper-15: rgba(245, 240, 232, 0.15); /* crema al 15% — bordes */
      --ok: #4caf50;             /* verde — conectado */
      --warn: #ffb000;           /* ámbar — reconectando */
      --err: #ff3b30;            /* rojo — desconectado */
    }

    body {
      font-family: 'JetBrains Mono', monospace; /* mono como base de todo */
      background: var(--ink);                    /* fondo negro tinta */
      color: var(--paper);                       /* texto crema */
      overflow: hidden;                          /* sin scroll de página */
      height: 100vh;
      position: relative;
    }

    /* ── Fondo: rejilla + ruido (idénticos al diseño original) ─────────── */
    .bg-grid {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image:
              linear-gradient(rgba(245, 240, 232, 0.03) 1px, transparent 1px),
              linear-gradient(90deg, rgba(245, 240, 232, 0.03) 1px, transparent 1px); /* rejilla de 40px apenas visible */
      background-size: 40px 40px;
      pointer-events: none; /* no bloquea clics */
    }

    .noise-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E"); /* grano de película como SVG inline */
      pointer-events: none;
      z-index: 100;
      mix-blend-mode: overlay; /* el ruido se funde con lo que hay debajo */
    }

    /* ── Info de esquinas (visible en el login) ─────────────────────────── */
    .corner-info {
      position: absolute; font-size: 11px; color: var(--paper-40);
      letter-spacing: 2px; font-weight: 500; z-index: 5;
    }
    .corner-info.tl { top: 30px; left: 30px; }             /* arriba izquierda */
    .corner-info.tr { top: 30px; right: 30px; text-align: right; }   /* arriba derecha */
    .corner-info.bl { bottom: 30px; left: 30px; }          /* abajo izquierda — coordenadas de Zürich */
    .corner-info.br { bottom: 30px; right: 30px; text-align: right; } /* abajo derecha — reloj vivo */

    /* ══ PANTALLA DE LOGIN (panel dividido del diseño original) ═════════ */
    #login-scene {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center; /* contenedor centrado */
    }

    .terminal-container {
      position: relative; z-index: 10;
      max-width: 720px; width: 90%;
      background: var(--ink);
      border: 1px solid var(--paper-15); /* borde fino y duro, sin redondear */
      display: grid; grid-template-columns: 1fr 1fr; /* dos paneles: crema | negro */
      min-height: 480px;
    }

    .left-panel {
      padding: 50px 40px;
      border-right: 1px solid var(--paper-15);
      display: flex; flex-direction: column; justify-content: space-between;
      background: var(--paper); color: var(--ink); /* panel invertido: crema con tinta */
      position: relative; overflow: hidden;
    }
    .left-panel::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 100%; height: 4px; background: var(--ink); /* franja negra superior */
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif; /* display para el nombre grande */
      font-size: 56px; font-weight: 700; line-height: 0.9;
      letter-spacing: -2px; margin-top: 20px;
    }
    .brand-line { display: block; }             /* cada palabra en su línea */
    .brand-line.italic { font-style: italic; font-weight: 500; } /* segunda línea en cursiva */

    .brand-meta {
      font-size: 11px; color: rgba(10, 10, 10, 0.6);
      letter-spacing: 3px; font-weight: 500; margin-top: 30px; /* stack visible para recruiters */
    }
    .dot-divider {
      display: inline-block; width: 4px; height: 4px;
      background: var(--ink); border-radius: 50%;
      margin: 0 8px; vertical-align: middle; /* separador de puntos entre palabras */
    }

    .left-bottom { font-size: 10px; color: rgba(10, 10, 10, 0.5); letter-spacing: 2px; font-weight: 500; }
    .left-bottom .number {
      font-size: 32px; color: var(--ink); font-weight: 800; display: block;
      font-family: 'Space Grotesk', sans-serif; letter-spacing: -1px; /* número grande de sesiones */
    }

    .right-panel {
      padding: 50px 40px;
      display: flex; flex-direction: column; justify-content: center;
      background: var(--ink); /* panel oscuro con el formulario */
    }

    .section-label {
      font-size: 10px; color: var(--paper-40); letter-spacing: 4px;
      margin-bottom: 30px; font-weight: 500;
      display: flex; align-items: center; gap: 10px;
    }
    .section-label::before {
      content: ''; width: 8px; height: 8px;
      background: var(--paper); display: inline-block; /* cuadrado sólido antes del label */
    }

    .form-group { margin-bottom: 28px; }

    .terminal-label {
      display: block; font-size: 10px; color: rgba(245, 240, 232, 0.5);
      margin-bottom: 8px; letter-spacing: 3px; font-weight: 500; /* etiqueta uppercase espaciada */
    }

    .terminal-input {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid rgba(245, 240, 232, 0.3); /* solo subrayado, sin caja */
      padding: 8px 0; font-family: 'JetBrains Mono', monospace;
      font-size: 16px; color: var(--paper); outline: none;
      transition: all 0.2s ease; letter-spacing: 1px; font-weight: 400;
    }
    .terminal-input::placeholder { color: rgba(245, 240, 232, 0.2); } /* placeholder fantasma */
    .terminal-input:focus { border-bottom-color: var(--paper); }      /* el subrayado se enciende al enfocar */

    .terminal-button {
      width: 100%; background: var(--paper); border: none;
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
      color: var(--ink); cursor: pointer; letter-spacing: 4px;
      transition: all 0.2s ease; font-weight: 700; margin-top: 20px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; /* botón bloque crema, sin redondear */
    }
    .terminal-button:hover {
      background: var(--ink); color: var(--paper);
      outline: 1px solid var(--paper); /* hover invertido con contorno */
    }
    .terminal-button .arrow { font-size: 18px; font-weight: 400; } /* flecha del botón */

    .status-text {
      text-align: left; font-size: 11px; color: rgba(245, 240, 232, 0.5);
      margin-top: 24px; min-height: 16px; letter-spacing: 2px; font-weight: 500;
    }
    .status-text::before { content: '> '; color: var(--paper-40); } /* prefijo de prompt */

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); } /* sacudida al fallar la entrada */
    }

    /* ══ PANTALLA DE CHAT (mismo lenguaje visual) ═══════════════════════ */
    #chat-scene { display: none; height: 100vh; flex-direction: column; position: relative; z-index: 10; } /* oculta hasta conectar */
    #chat-scene.active { display: flex; } /* estado visible */

    /* barra superior */
    #chat-topbar {
      border-bottom: 1px solid var(--paper-15);
      padding: 16px 30px;
      display: flex; align-items: baseline; gap: 20px;
      background: var(--ink);
    }
    #chat-topbar .brand-small {
      font-family: 'Space Grotesk', sans-serif; font-weight: 700;
      font-size: 20px; letter-spacing: -0.5px; /* marca compacta en el chat */
    }
    #chat-topbar .brand-small .italic { font-style: italic; font-weight: 500; }
    #chat-topbar .meta { font-size: 10px; color: var(--paper-40); letter-spacing: 3px; font-weight: 500; }
    #chat-topbar .right { margin-left: auto; display: flex; gap: 24px; align-items: baseline; }
    #user-tag {
      background: var(--paper); color: var(--ink);
      padding: 3px 10px; font-size: 10px; font-weight: 700; letter-spacing: 2px; /* chip invertido con el @nombre */
    }
    #clock { font-size: 10px; color: var(--paper-40); letter-spacing: 2px; } /* reloj vivo en el chat */

    /* log de mensajes */
    #messages {
      flex: 1; overflow-y: auto; padding: 24px 30px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .row { display: flex; gap: 16px; align-items: baseline; } /* una fila por mensaje */
    .row .ts { font-size: 10px; color: var(--paper-40); letter-spacing: 1px; flex-shrink: 0; width: 42px; } /* timestamp fijo */
    .row .who {
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      flex-shrink: 0; min-width: 110px; text-transform: uppercase; /* remitente uppercase brutalist */
    }
    .row .who.me { background: var(--paper); color: var(--ink); padding: 2px 8px; text-align: center; } /* yo: chip invertido */
    .row .who.other { color: var(--paper); border-bottom: 2px solid var(--paper); padding-bottom: 1px; text-align: center; } /* otros: subrayado grueso */
    .row .who.srv { color: var(--ok); border-bottom: 2px solid var(--ok); padding-bottom: 1px; text-align: center; } /* server: verde */
    .row .txt { font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; min-width: 0; } /* contenido */
    .row.sys { color: var(--paper-40); }                       /* eventos de sistema atenuados */
    .row.sys .txt { font-size: 11px; letter-spacing: 2px; }    /* sistema en letra pequeña espaciada */
    .row.sys .txt::before { content: '// '; }                  /* prefijo de comentario de código */
    .row.srvout .txt {
      background: var(--paper); color: var(--ink);
      padding: 10px 14px; font-size: 12.5px;
      white-space: pre-wrap; display: inline-block; /* respuesta del server: bloque invertido tipo "papel impreso" */
    }

    /* línea de entrada */
    #input-area {
      border-top: 1px solid var(--paper-15);
      padding: 20px 30px; background: var(--ink);
      display: flex; align-items: baseline; gap: 16px;
    }
    #input-label { font-size: 10px; color: rgba(245, 240, 232, 0.5); letter-spacing: 3px; font-weight: 500; flex-shrink: 0; } /* etiqueta MESSAGE */
    #message-input {
      flex: 1; background: transparent; border: none;
      border-bottom: 1px solid rgba(245, 240, 232, 0.3);
      padding: 8px 0; font-family: 'JetBrains Mono', monospace;
      font-size: 14px; color: var(--paper); outline: none;
      transition: all 0.2s ease; letter-spacing: 1px; /* mismo input subrayado del login */
    }
    #message-input:focus { border-bottom-color: var(--paper); } /* subrayado encendido */
    #message-input:disabled { opacity: 0.3; }                    /* atenuado offline */
    #message-input::placeholder { color: rgba(245, 240, 232, 0.2); }
    #send-btn {
      background: var(--paper); border: none; color: var(--ink);
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      font-weight: 700; letter-spacing: 3px; padding: 10px 18px;
      cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; /* botón bloque como en el login */
    }
    #send-btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); outline: 1px solid var(--paper); } /* hover invertido */
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* barra inferior con estado y comandos */
    #chat-bottombar {
      border-top: 1px solid var(--paper-15);
      padding: 12px 30px; background: var(--ink);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10px; color: var(--paper-40); letter-spacing: 3px; font-weight: 500;
      flex-wrap: wrap; gap: 10px;
    }
    .live-indicator { display: flex; align-items: center; gap: 8px; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; animation: live-pulse 1.5s ease-in-out infinite; } /* punto pulsante */
    .live-dot.connected { background: var(--ok); }       /* verde conectado */
    .live-dot.connecting { background: var(--warn); }    /* ámbar reconectando */
    .live-dot.disconnected { background: var(--err); animation: none; } /* rojo fijo desconectado */
    @keyframes live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .cmds { display: flex; gap: 20px; flex-wrap: wrap; }
    .cmd { cursor: pointer; transition: color 0.2s ease; }
    .cmd:hover { color: var(--paper); } /* comando se enciende al pasar el mouse */

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--paper-15); } /* plano, sin redondear */

    /* responsive */
    @media (max-width: 700px) {
      .terminal-container { grid-template-columns: 1fr; min-height: auto; } /* login en una columna */
      .left-panel { border-right: none; border-bottom: 1px solid var(--paper-15); padding: 30px 25px; }
      .right-panel { padding: 30px 25px; }
      .brand { font-size: 38px; }
      .corner-info { font-size: 9px; }
      .corner-info.tl { top: 15px; left: 15px; }
      .corner-info.tr { top: 15px; right: 15px; }
      .corner-info.bl { bottom: 15px; left: 15px; }
      .corner-info.br { bottom: 15px; right: 15px; }
      .row .who { min-width: 80px; }
      #chat-topbar, #messages, #input-area, #chat-bottombar { padding-left: 16px; padding-right: 16px; } /* menos padding en móvil */
    }
  </style>
</head>
<body>
<div class="bg-grid"></div>       <!-- rejilla de fondo, siempre visible -->

<!-- ══ ESCENA DE LOGIN ══════════════════════════════════════════ -->
<div id="login-scene"> <!-- visible al cargar, se oculta tras conectar -->

  <div class="corner-info tl">SYS // 01<br>rikroig.dev</div>     <!-- esquina: marca -->
  <div class="corner-info tr">WEBSOCKET<br>SPRING BOOT</div>      <!-- esquina: stack visible -->
  <div class="corner-info bl">LAT 47.376<br>LON 8.541</div>       <!-- esquina: coordenadas de Zürich -->
  <div class="corner-info br">--:--:--<br>UTC+1</div>             <!-- esquina: reloj vivo (JS) -->

  <div class="terminal-container" id="loginBox">
    <div class="left-panel">
      <div>
        <div style="font-size: 10px; letter-spacing: 4px; font-weight: 700; margin-bottom: 4px;">// 004</div> <!-- número de proyecto en tu portfolio -->
        <h1 class="brand">
          <span class="brand-line">rikroig</span>          <!-- tu marca -->
          <span class="brand-line italic">chat.</span>     <!-- el producto -->
        </h1>
        <div class="brand-meta">
          JAVA<span class="dot-divider"></span>WEBSOCKET<span class="dot-divider"></span>LIVE <!-- stack en el panel crema -->
        </div>
      </div>

      <div class="left-bottom">
        ONLINE CLIENTS
        <span class="number" id="client-count">—</span>    <!-- se llena con el SessionInfo periódico del server -->
        RIGHT NOW
      </div>
    </div>

    <div class="right-panel">
      <div class="section-label">IDENTIFY</div>            <!-- solo nombre — el server no pide password -->

      <form id="loginForm">
        <div class="form-group">
          <label class="terminal-label" for="username-input">USERNAME</label>
          <input
                  type="text"
                  class="terminal-input"
                  id="username-input"
                  placeholder="dein name"
                  maxlength="32"
                  autocomplete="off"
          > <!-- el nombre viaja como ?name= al servidor -->
        </div>

        <button type="submit" class="terminal-button">
          <span>CONNECT</span>
          <span class="arrow">→</span>
        </button>

        <div class="status-text" id="login-status">awaiting input</div> <!-- estado del login -->
      </form>
    </div>
  </div>
</div>

<!-- ══ ESCENA DE CHAT ═══════════════════════════════════════════ -->
<div id="chat-scene"> <!-- UI principal, oculta hasta conectar -->

  <!-- barra superior -->
  <div id="chat-topbar">
    <span class="brand-small">rikroig <span class="italic">chat.</span></span> <!-- marca compacta -->
    <span class="meta">// CHAT ROOM</span>                                     <!-- etiqueta de sala -->
    <span class="right">
      <span id="user-tag"></span>   <!-- chip invertido con @nombre -->
      <span id="clock">--:--:--</span> <!-- reloj vivo -->
    </span>
  </div>

  <div id="messages"></div> <!-- las filas de mensajes se agregan aquí dinámicamente -->

  <!-- línea de entrada -->
  <div id="input-area">
    <span id="input-label">MESSAGE</span> <!-- etiqueta del campo -->
    <input type="text" id="message-input" placeholder="nachricht oder @server befehl…" autocomplete="off" disabled /> <!-- deshabilitado hasta que el WebSocket esté OPEN -->
    <button id="send-btn" disabled>SEND →</button> <!-- botón bloque -->
  </div>

  <!-- barra inferior: estado + comandos del bot (InfoCommand.java + MathCommand.java) -->
  <div id="chat-bottombar">
    <div class="live-indicator">
      <div class="live-dot disconnected" id="live-dot"></div> <!-- punto de estado -->
      <span id="status-text">OFFLINE</span>                    <!-- texto de estado -->
    </div>
    <div class="cmds">
      <span class="cmd" data-cmd="@server info">@SERVER INFO</span>            <!-- comando clicable 1 -->
      <span class="cmd" data-cmd="@server math ">@SERVER MATH &lt;EXPR&gt;</span> <!-- comando clicable 2 -->
      <span>ENTER = SEND</span>                                                <!-- pista de teclado -->
    </div>
  </div>
</div>

<div class="noise-overlay"></div> <!-- grano por encima de todo -->

<script>
  // ── Referencias del DOM ──────────────────────────────────────────────────
  const loginScene    = document.getElementById('login-scene');    // escena de login
  const chatScene     = document.getElementById('chat-scene');     // escena de chat
  const loginBox      = document.getElementById('loginBox');       // contenedor del panel dividido (para shake)
  const loginForm     = document.getElementById('loginForm');      // formulario de login
  const loginStatus   = document.getElementById('login-status');   // texto "> awaiting input"
  const usernameInput = document.getElementById('username-input'); // campo USERNAME
  const clientCount   = document.getElementById('client-count');   // número grande del panel crema
  const messagesEl    = document.getElementById('messages');       // contenedor del log
  const messageInput  = document.getElementById('message-input');  // campo MESSAGE
  const sendBtn       = document.getElementById('send-btn');       // botón SEND
  const userTag       = document.getElementById('user-tag');       // chip @nombre
  const liveDot       = document.getElementById('live-dot');       // punto de estado
  const statusTextEl  = document.getElementById('status-text');    // texto ONLINE/OFFLINE
  const cmdSpans      = document.querySelectorAll('.cmd');         // comandos clicables

  // ── Estado de la aplicación ──────────────────────────────────────────────
  let ws          = null;  // instancia activa del WebSocket
  let username    = '';    // nombre visible del usuario (se envía como ?name= al servidor)
  let retryDelay  = 1000;  // espera actual de reconexión en ms (crece con backoff)
  let retryTimer  = null;  // handle del setTimeout de reconexión pendiente
  let intentional = false; // true cuando el usuario se desconecta a propósito (uso futuro)

  // ── Helpers ──────────────────────────────────────────────────────────────

  // Construye la URL del WebSocket usando el mismo host de la página, con wss:// en HTTPS
  function buildWsUrl(name) {
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:'; // coincide con el esquema de la página
    return `${proto}//${window.location.host}/ws?name=${encodeURIComponent(name)}`; // el servidor lee ?name= en afterConnectionEstablished
  }

  // Actualiza el punto y el texto de estado de la barra inferior
  function setStatus(cssClass, label) {
    liveDot.className = `live-dot ${cssClass}`; // connected | connecting | disconnected
    statusTextEl.textContent = label;           // texto uppercase visible
  }

  // Devuelve la hora actual como HH:MM para el timestamp de cada fila
  function nowHHMM() {
    return new Date().toTimeString().slice(0, 5); // recorta "HH:MM" de la hora local
  }

  // Agrega una fila de mensaje al log y hace scroll hasta abajo
  // kind: 'me' | 'other' | 'srv' | 'sys' | 'srvout'
  function addLine(kind, sender, text) {
    const row = document.createElement('div');   // fila del log
    row.className = 'row' + (kind === 'sys' ? ' sys' : '') + (kind === 'srvout' ? ' srvout' : ''); // clases según tipo

    const ts = document.createElement('span');   // columna de timestamp
    ts.className = 'ts';
    ts.textContent = nowHHMM();
    row.appendChild(ts);

    if (kind !== 'sys') {                        // los eventos de sistema no llevan remitente
      const who = document.createElement('span'); // columna del remitente
      who.className = 'who ' + (kind === 'me' ? 'me' : (kind === 'srv' || kind === 'srvout') ? 'srv' : 'other');
      who.textContent = sender;                  // el CSS lo pone en uppercase
      row.appendChild(who);
    }

    const txt = document.createElement('span');  // columna del contenido
    txt.className = 'txt';
    txt.textContent = text;                      // textContent = a prueba de inyección HTML
    row.appendChild(txt);

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight; // auto-scroll a la fila más nueva
  }

  // Construye el payload JSON que espera el servidor (esquema de Message.java)
  function buildPayload(text) {
    return JSON.stringify({           // serializa el objeto Message completo
      header: {
        origin:      username,        // MessageHeader.origin — nuestro nombre visible
        destination: null,            // null = broadcast (sin destinatario específico)
        timestamp:   new Date().toISOString(), // MessageHeader.timestamp como string ISO-8601
        type:        'Chat'           // valor del enum MessageType.Chat
      },
      data: {
        message: text                 // MessageData.message — el texto real
      }
    });
  }

  // Parsea y renderiza un frame entrante del WebSocket
  function handleFrame(raw) {
    let parsed;
    try {
      parsed = JSON.parse(raw);       // intenta parsear como Message JSON
    } catch (_) {
      addLine('sys', '', raw);        // frames no-JSON como fila de sistema (no debería pasar, SynAckMiddleware desactivado)
      return;
    }

    const msgType = parsed?.header?.type;               // MessageType: "Chat" o "ServerInfo"
    const origin  = parsed?.header?.origin ?? 'server'; // remitente desde el header
    const text    = parsed?.data?.message ?? '';        // contenido desde data

    if (msgType === 'Chat') {
      addLine('other', origin, text); // mensaje broadcast de otro usuario
      return;
    }

    if (msgType === 'ServerInfo') {
      // El servidor envuelve el JSON periódico de SessionInfo dentro de data.message (ver Websocket.java printMessage())
      try {
        const inner = JSON.parse(text);            // intenta desenvolver el string JSON interno
        if (typeof inner.connectedClients === 'number') {
          clientCount.textContent = inner.connectedClients; // actualiza el número grande del login
          addLine('sys', '', `clients online: ${inner.connectedClients}`); // y lo registra en el log
          return;
        }
      } catch (_) {
        // data.message es texto plano — respuesta de comando @server
      }
      addLine('srvout', 'server', text);          // respuesta de @server info / @server math en bloque invertido
    }
  }

  // ── Ciclo de vida del WebSocket ──────────────────────────────────────────

  // Abre una nueva conexión WebSocket y registra los event handlers
  function connect() {
    clearTimeout(retryTimer);                          // cancela cualquier reconexión pendiente
    setStatus('connecting', 'CONNECTING…');

    ws = new WebSocket(buildWsUrl(username));          // abre la conexión; el servidor lee ?name=

    ws.onopen = () => {
      retryDelay = 1000;                               // reinicia el backoff exponencial al conectar
      setStatus('connected', 'SYSTEM ONLINE');
      messageInput.disabled = false;                   // permite escribir
      sendBtn.disabled      = false;                   // permite enviar
      messageInput.focus();
      addLine('sys', '', `connected as ${username}`);  // evento de sistema
    };

    ws.onmessage = (event) => {
      handleFrame(event.data);                         // despacha cada frame de texto entrante
    };

    ws.onclose = () => {
      messageInput.disabled = true;                    // bloquea la entrada mientras está offline
      sendBtn.disabled      = true;
      if (intentional) {                               // desconexión limpia (reservado para futuro botón)
        setStatus('disconnected', 'OFFLINE');
        return;
      }
      // Cierre inesperado — reintenta con backoff exponencial (máx. 30 s)
      const delay = retryDelay;
      retryDelay  = Math.min(retryDelay * 2, 30000);  // duplica la espera, tope en 30 s
      setStatus('connecting', `RETRY ${delay / 1000}S`);
      addLine('sys', '', `connection lost — retry in ${delay / 1000}s`);
      retryTimer = setTimeout(connect, delay);         // programa el siguiente intento
    };

    ws.onerror = () => {
      // onerror siempre dispara antes de onclose; el estado se maneja en onclose
    };
  }

  // ── Envío de mensajes ────────────────────────────────────────────────────

  function sendMessage() {
    const text = messageInput.value.trim();            // lee y recorta el campo
    if (!text) return;                                 // ignora envíos vacíos
    if (!ws || ws.readyState !== WebSocket.OPEN) return; // guardia: debe estar conectado

    ws.send(buildPayload(text));                       // envía el Message JSON al servidor
    addLine('me', username, text);                     // eco local (el servidor NO devuelve el eco al remitente)
    messageInput.value = '';                           // limpia el campo
  }

  // ── Event listeners ──────────────────────────────────────────────────────

  // Clic en un comando de la barra inferior lo pega en el campo
  cmdSpans.forEach(span => {
    span.addEventListener('click', () => {
      messageInput.value = span.dataset.cmd;           // pega la plantilla (puede llevar espacio final para argumentos)
      messageInput.focus();
    });
  });

  messageInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();              // Enter envía el mensaje
  });

  sendBtn.addEventListener('click', sendMessage);      // el clic también envía

  // Login: validar el nombre, cambiar de escena y abrir el WebSocket
  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();                                // evita el submit clásico del form

    const name = usernameInput.value.trim();           // sanea el nombre
    if (!name) {
      loginStatus.textContent = 'name required';       // mensaje de error
      loginBox.style.animation = 'shake 0.4s';         // sacudida brutalist
      setTimeout(() => { loginBox.style.animation = ''; }, 400);        // limpia la animación
      setTimeout(() => { loginStatus.textContent = 'awaiting input'; }, 2000); // vuelve al estado base
      return;
    }

    username = name;                                   // lo guarda globalmente para los payloads
    loginStatus.textContent = 'establishing connection'; // feedback inmediato
    loginScene.style.display = 'none';                 // oculta el login
    chatScene.classList.add('active');                 // revela el chat
    userTag.textContent = `@${username.toUpperCase()}`; // chip invertido en la topbar
    connect();                                         // abre la conexión WebSocket
  });

  // ── Reloj vivo (login y chat comparten la misma hora) ───────────────────
  function updateClock() {
    const now = new Date();
    const hhmmss = now.toTimeString().slice(0, 8);     // "HH:MM:SS" de la hora local
    const loginClock = document.querySelector('.corner-info.br'); // reloj de la esquina del login
    if (loginClock) loginClock.innerHTML = hhmmss + '<br>UTC+1';
    const chatClock = document.getElementById('clock');           // reloj de la topbar del chat
    if (chatClock) chatClock.textContent = hhmmss;
  }
  setInterval(updateClock, 1000);                      // actualiza cada segundo
  updateClock();                                       // y una vez al cargar

  // Foco inicial en el campo de nombre
  setTimeout(() => { usernameInput.focus(); }, 300);   // pequeño delay para que la fuente cargue
</script>
